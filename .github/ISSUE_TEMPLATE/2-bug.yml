name: Bug report
description: Something in MaxGuard or its documentation does not work as written.
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **A security problem?** Do not use this form. Use **Security → Report a vulnerability**
        so it can be fixed before it is public.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Exact steps to reproduce
      description: The commands you ran, in order. Use a lab capture or a fixture, never a real network's traffic.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the exact output. Remove IP addresses, host names, and anything else from a real network first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit from `git rev-parse --short HEAD`.
      placeholder: "v2.0-alpha or 1a2b3c4"
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - Laptop (virtual environment)
        - Docker image
        - Raspberry Pi sensor
        - GitHub Actions (CI)
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets, tokens, email addresses, and real network data from this report.
          required: true
